[project]
name = "llm-gateway"
version = "0.1.0"
description = "One OpenAI-compatible endpoint in front of Claude, GPT, Gemini and local models: routing and fallback, per-team keys and budgets, PII redaction, caching and observability."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gabriel Cuesta" }]
requires-python = ">=3.11"
keywords = ["llm", "gateway", "proxy", "openai-compatible", "fallback", "pii", "finops", "observability"]
dependencies = [
  "fastapi>=0.143.0",
  "uvicorn>=0.54.0",
  "httpx>=0.28.1,<1",
  "pydantic>=2.14.1,<3",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.45.1", "opentelemetry-exporter-otlp>=1.45.1"]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.17.0", "openai>=3.29.0"]

[project.scripts]
llm-gateway = "llm_gateway.cli:main"

[project.urls]
Homepage = "https://github.com/gabicuesta/llm-gateway"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long inline wire-format fixtures read better unwrapped
